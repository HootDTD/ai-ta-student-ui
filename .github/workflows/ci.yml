# CI for the student UI (Next.js).
#
# `ci-passed` is the aggregation job — the single status to require in branch
# protection and for Railway's "Wait for CI" deploy gate. Add test jobs later
# (vitest/playwright) by listing them in its `needs` — the required-check name
# stays stable.
#
# Branch model: ApolloV3 = production line (Railway prod), staging = integration
# (Railway staging). `main` kept for legacy PRs.
name: CI

on:
  push:
    branches: [main, staging, ApolloV3]
  pull_request:
    branches: [main, staging, ApolloV3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docs:
    name: docs (architecture ownership lint)
    runs-on: ubuntu-latest
    # REQUIRED (W5 flip, PLAN §6.3/§7): the docs/granular-restructure split is green,
    # so the lint is now in ci-passed.needs, continue-on-error is dropped, and the
    # --check-last-verified PR-path gate is enabled as required. The last_verified
    # gate is skipped on promotion PRs (base=main) — enforced on the way INTO staging.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # base history for the last_verified PR-path check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Ownership bijection + related + index-freshness + size lint (.ts/.tsx)
        run: python scripts/docs/check_owns_coverage.py --check-size
      - name: last_verified PR-path gate (changed owned file must bump its leaf)
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python scripts/docs/check_owns_coverage.py \
            --check-last-verified --last-verified-required \
            --base "origin/${{ github.base_ref }}"

  ci-passed:
    name: ci-passed
    # `docs` is REQUIRED as of the W5 flip (PLAN §7) — in needs and the assertion.
    if: always()
    needs: [build, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Assert required jobs passed
        run: |
          echo "build=${{ needs.build.result }}"
          echo "docs=${{ needs.docs.result }}"
          test "${{ needs.build.result }}" = "success" \
            && test "${{ needs.docs.result }}" = "success"
